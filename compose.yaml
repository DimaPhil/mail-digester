services:
  mail-digester:
    container_name: mail-digester
    build:
      context: .
      dockerfile: Dockerfile
    image: mail-digester:latest
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "127.0.0.1:4001:4001"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "4001"
      HOSTNAME: "0.0.0.0"
      MAIL_DIGESTER_DB_PATH: /app/data/mail-digester.sqlite
      MAIL_DIGESTER_INGEST_TOKEN: ${MAIL_DIGESTER_INGEST_TOKEN:-}
      MAIL_DIGESTER_FEEDBACK_TOKEN: ${MAIL_DIGESTER_FEEDBACK_TOKEN:-}
      MAIL_DIGESTER_PUBLIC_ORIGIN: ${MAIL_DIGESTER_PUBLIC_ORIGIN:?set public HTTPS origin}
      MAIL_DIGESTER_ALLOWED_SOURCES: ${MAIL_DIGESTER_ALLOWED_SOURCES:-tldr,tldr-ai}
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
